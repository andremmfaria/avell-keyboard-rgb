<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed to /usr/share/dbus-1/system.d/. Only the avell-rgb user may own the name.
     Anyone may call it: changes are gated by polkit inside the daemon, reads are open. -->
<busconfig>
  <policy user="avell-rgb">
    <allow own="io.github.andremmfaria.AvellRgb"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.andremmfaria.AvellRgb"/>
    <allow receive_sender="io.github.andremmfaria.AvellRgb"/>
  </policy>
</busconfig>
